
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <!-- Bag (bigger) -->
  <rect x="6" y="14" width="52" height="40" rx="12" fill="white" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Handle (adjusted) -->
  <path d="M14 14 Q32 2 50 14" stroke="#e1e3e6" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Gold Gradient -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d27a"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
  </defs>

  <!-- Circle (bigger) -->
  <circle cx="32" cy="38" r="14" fill="url(#goldGrad)"/>

  <!-- C (bigger + centered) -->
  <text x="32" y="45" text-anchor="middle" font-size="20" fill="#0f172a" font-family="Segoe UI, Arial" font-weight="700">
    C
  </text>

</svg>