<svg width="240" height="80" viewBox="0 0 380 130" xmlns="http://www.w3.org/2000/svg">

  <!-- Bag -->
  <rect x="20" y="35" width="95" height="75" rx="18" fill="white" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Handle -->
  <path d="M35 35 Q67 8 100 35" stroke="#e6eaf2" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Gold Gradient -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d27a"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
  </defs>

  <!-- Circle -->
  <circle cx="67" cy="75" r="26" fill="url(#goldGrad)"/>

  <!-- C -->
  <text x="67" y="83" text-anchor="middle" font-size="30" fill="#0f172a" font-family="Segoe UI, Arial" font-weight="600">
    C
  </text>

  <!-- Brand Name -->
  <text x="135" y="70" font-size="45" font-family="Segoe UI, Arial" fill="#0e7490" font-weight="700" letter-spacing="1">
    Cartify
  </text>

  <!-- Tagline -->
  <text x="135" y="100" font-size="15" font-family="Segoe UI, Arial" fill="#e5e6e8" letter-spacing="1.5">
    SMART SHOPPING EXPERIENCE
  </text>

</svg>