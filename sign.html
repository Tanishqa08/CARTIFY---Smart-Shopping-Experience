<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <style>
    .sign-page { max-width: 420px; margin: 80px auto; background:#fff; padding:20px; border-radius:6px; }
    .sign-page h2{ margin-bottom: 12px }
    .form-group { margin-bottom:10px }
    input[type="text"], input[type="password"], input[type="email"] { width:100%; padding:8px; border-radius:4px; border:1px solid #ccc }
    .btn { background: #0e7490; color: #111; border-radius:6px; padding:10px 16px; display:inline-block }
    .small { font-size: 13px; color: #555 }
  </style>
</head>
<body>
  <header class="header">
    <div class="nav">
      <div class="nav-logo"><div class="logo"></div></div>
    </div>
  </header>

  <main class="sign-page">
    <h2>Sign in</h2>
    <p class="small">Sign in to access your account, view orders and more.</p>
    <div class="form-group">
      <label>Email or mobile phone number</label>
      <input type="text" id="signin-email" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="signin-password" />
    </div>
    <div class="form-group">
      <button id="signin-btn" class="btn">Sign in</button>
    </div>
    <hr />
    <p class="small">New to site? <a href="register.html">Create your account</a></p>
  </main>

  <script>
    document.getElementById('signin-btn').addEventListener('click', ()=>{
      const email = document.getElementById('signin-email').value.trim();
      alert('This is a demo sign-in. You entered: '+ email);
    });
  </script>
</body>
</html>
